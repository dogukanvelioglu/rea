name: Product review workspace

on:
  push:
    paths:
      - "research/**"
      - ".gitignore"
      - ".github/workflows/product-review.yml"
  pull_request:
    paths:
      - "research/**"
      - ".gitignore"
      - ".github/workflows/product-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify case handling and runtime lock
        run: python -m unittest discover -s research/tests -v
      - name: Verify local data is ignored
        run: |
          for path in research/cases/example/case.json research/.runtime/example research/.cache/example work/target.bin outputs/report.md; do
            git check-ignore --quiet "$path" || exit 1
          done
